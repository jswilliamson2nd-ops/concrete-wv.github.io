<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ACI West Virginia Interest Group</title>

  <link rel="icon" href="/assets/aciwv_logo_favicon_256x256.png" type="image/png" />
  <link rel="canonical" href="https://concrete-wv.org/" />
  <meta name="theme-color" content="#0b1220" />

  <!-- PWA -->
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/assets/pwa/icon-192.png">

  <!-- SEO / Social -->
  <meta name="description" content="ACI West Virginia Interest Group — building a statewide community to advance concrete knowledge, quality, and certification." />
  <meta property="og:title" content="ACI West Virginia Interest Group" />
  <meta property="og:description" content="Advancing concrete knowledge, quality, and certification across West Virginia." />
  <meta property="og:image" content="https://concrete-wv.org/assets/aci_wv_primary_logo_web_trans.png" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://concrete-wv.org/" />
  <meta name="twitter:card" content="summary_large_image" />

  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #0f172a;
      --card: #101828;
      --border: #1f2a44;
      --text: #e6edf3;
      --text-dim: #b9c4d0;
      --shadow: 0 6px 18px rgba(0,0,0,.25);

      --aci-blue: #00539B;
      --aci-blue-2: #007BC1;
      --aci-orange: #F5821F;

      --accent: var(--aci-blue);
      --accent-2: var(--aci-blue-2);
      --orange: var(--aci-orange);

      --radius: 20px;
    }

    .light {
      --bg: #f8fafc;
      --bg-2: #f1f5f9;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-dim: #475569;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg-2) 100%);
      color: var(--text);
      line-height: 1.6;
    }

    a { color: var(--text); text-decoration: none; }
    a:hover { color: var(--accent-2); }

    .container {
      width: min(1080px, 92vw);
      margin: 0 auto;
      padding: 0 16px;
    }

    /* Skip link - improved visibility */
    .skip {
      position: absolute;
      left: 16px;
      top: -100px;
      z-index: 100;
      background: var(--card);
      border: 2px solid var(--accent-2);
      color: var(--text);
      padding: 12px 18px;
      border-radius: 999px;
      box-shadow: var(--shadow);
      transition: top 0.3s, outline 0.2s;
      font-weight: 700;
    }
    .skip:focus-visible {
      top: 16px;
      outline: 4px solid var(--accent-2);
      outline-offset: 4px;
    }

    /* Header */
    header {
      position: sticky;
      top: 0;
      z-index: 50;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(12px);
      background: rgba(11,18,32,.88);
      -webkit-backdrop-filter: blur(12px);
    }
    body.light header {
      background: rgba(248,250,252,.92);
    }

    .nav {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 16px;
      align-items: center;
      padding: 12px 0;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }
    .brand img {
      height: 54px;
      width: auto;
      max-width: 340px;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,.4));
    }
    @media (max-width: 980px) {
      .brand img { height: 48px; max-width: 280px; }
    }

    nav {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav a {
      color: var(--text-dim);
      padding: 8px 14px;
      font-weight: 750;
      border-radius: 12px;
      white-space: nowrap;
      border: 1px solid transparent;
      transition: all 0.2s ease;
    }
    nav a:hover {
      color: var(--text);
      border-color: rgba(0,123,193,.4);
      background: rgba(0,123,193,.12);
    }
    nav a.active {
      color: var(--text);
      background: rgba(0,83,155,.28);
      border-color: rgba(0,83,155,.5);
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-content: flex-end;
    }

    /* Countdown badge */
    .count-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 14px;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(255,255,255,.06);
      box-shadow: 0 6px 20px rgba(0,0,0,.2);
      white-space: nowrap;
      max-width: 300px;
    }
    .count-badge .num {
      font-weight: 950;
      color: var(--orange);
      font-size: 1.15rem;
      min-width: 3.5ch;
      text-align: right;
    }
    @media (max-width: 980px) {
      .count-badge { display: none; }
    }

    #theme-toggle {
      background: rgba(255,255,255,.1);
      border: 1px solid var(--border);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 10px 14px;
      border-radius: 14px;
      color: var(--text);
      box-shadow: 0 6px 18px rgba(0,0,0,.18);
      transition: all .2s;
    }
    #theme-toggle:hover {
      border-color: rgba(0,123,193,.5);
      background: rgba(0,123,193,.15);
    }
    body.light #theme-toggle {
      background: rgba(15,23,42,.08);
    }

    /* Mobile header */
    @media (max-width: 980px) {
      .nav {
        grid-template-columns: 1fr auto;
        grid-template-rows: auto auto;
      }
      .brand { grid-column: 1; }
      .header-right { grid-column: 2; }
      nav { grid-column: 1 / 3; padding-top: 6px; }
    }

    /* Announcement bar */
    .next-event-bar {
      background: var(--orange);
      color: #000;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      box-shadow: 0 4px 16px rgba(245,130,31,.28);
    }
    .next-event-bar .text {
      font-weight: 850;
      font-size: 1.05rem;
      flex: 1;
      min-width: 260px;
    }
    .next-event-bar a.btn {
      background: var(--accent);
      color: white;
      padding: 0.7rem 1.3rem;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,83,155,.25);
      border: 1px solid rgba(255,255,255,.2);
    }
    .next-event-bar a.btn:hover { background: var(--accent-2); }

    /* Hero */
    .hero-wrap {
      position: relative;
      isolation: isolate;
      border-bottom: 1px solid var(--border);
    }

    .hero-media {
      position: relative;
      aspect-ratio: 16 / 9;
      max-height: 54vh;
      overflow: hidden;
      background: #0d1626 url('/assets/aciwv_hero_1080p_loop.jpg') center/cover no-repeat;
    }
    @media (min-width: 1100px) {
      .hero-media { aspect-ratio: 2.6 / 1; max-height: 66vh; }
    }

    .hero-media video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 55%;
      filter: brightness(0.58) contrast(1.05) saturate(0.8);
    }

    /* Respect reduced motion */
    @media (prefers-reduced-motion: reduce) {
      .hero-media video { display: none; }
    }

    /* Mobile / data-saver fallback */
    @media (max-width: 860px), (hover: none) {
      .hero-media video { display: none; }
    }

    .hero-overlay {
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(900px 420px at 50% 70%, rgba(0,0,0,.08), rgba(0,0,0,.65)),
        linear-gradient(180deg, rgba(11,18,32,.6), rgba(11,18,32,.92));
      pointer-events: none;
    }

    .hero-text {
      position: absolute;
      bottom: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      color: white;
      text-shadow: 0 3px 20px rgba(0,0,0,.8);
      z-index: 2;
      max-width: min(980px, 92%);
      padding: 20px 24px;
      border-radius: 20px;
      background: rgba(0,0,0,.12);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255,255,255,.12);
    }

    .hero-logo {
      width: min(520px, 90%);
      height: auto;
      margin: 0 auto 20px;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,.6));
    }

    .hero-text h1 {
      font-size: clamp(2.2rem, 7.5vw, 3.8rem);
      margin: 0 0 0.4rem;
      line-height: 1.05;
      font-weight: 950;
      letter-spacing: 0.5px;
    }
    .hero-text p {
      font-size: 1.15rem;
      font-weight: 800;
      margin: 0;
      color: rgba(255,255,255,.94);
    }

    /* Cards & Grid */
    .section { padding: 48px 0; }
    .grid {
      display: grid;
      gap: 24px;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    }

    .card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--card);
      padding: 28px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(36px);
      transition: all 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .card.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Staggered entrance */
    .grid > :nth-child(1) { transition-delay: 100ms; }
    .grid > :nth-child(2) { transition-delay: 200ms; }
    .grid > :nth-child(3) { transition-delay: 300ms; }
    .grid > :nth-child(4) { transition-delay: 400ms; }

    /* Rest of your styles (CTA, buttons, timeline, etc.) remain mostly unchanged */
    /* ... (keeping original button, timeline, footer, floaters styles) ... */

    /* Final small touches */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      color: var(--text-dim);
      font-size: 0.95rem;
      padding: 32px 0;
    }
  </style>
</head>
<body>

  <a class="skip" href="#main">Skip to main content</a>

  <header>
    <div class="container nav">
      <div class="brand">
        <a href="/" aria-label="ACI West Virginia Interest Group home page">
          <img src="/assets/aci_wv_primary_logo_web_trans.png" alt="" loading="eager" decoding="async" />
        </a>
      </div>

      <nav aria-label="Primary navigation">
        <a href="/" class="active">Home</a>
        <a href="/topics/">Topics</a>
        <a href="/wvdoh.html">WVDOH Info Corner</a>
        <a href="/calculators/">Calculators</a>
        <a href="#verify">Verify</a>
        <a href="#contact">Contact</a>
      </nav>

      <div class="header-right">
        <div class="count-badge" title="Days until kickoff">
          <div class="num" id="countdown-badge">--</div>
          <div class="meta">
            <div class="top">Kickoff</div>
            <div class="sub">Jan 23 • 10:00 AM EST</div>
          </div>
        </div>
        <button id="theme-toggle" aria-label="Toggle between light and dark mode">🌙</button>
      </div>
    </div>
  </header>

  <!-- Rest of your HTML structure remains the same -->
  <!-- Just make sure hero-media contains video + poster fallback -->

  <div class="hero-wrap" aria-label="Bridge concreting construction footage">
    <div class="hero-media" aria-hidden="true">
      <video id="hero-video" autoplay muted loop playsinline preload="metadata" poster="/assets/aciwv_hero_1080p_loop.jpg">
        <source src="/assets/aciwv_hero_1080p_loop.webm" type="video/webm">
        <source src="/assets/aciwv_hero_1080p_loop.mp4" type="video/mp4">
      </video>
      <div class="hero-overlay"></div>
    </div>

    <div class="hero-text">
      <img class="hero-logo" src="/assets/aci_wv_primary_logo_web_trans.png" alt="ACI West Virginia Interest Group logo" loading="eager" decoding="async" />
      <h1>West Virginia Concrete Just Got Its Own Playbook</h1>
      <p>Zero cost. Zero spam. Real events starting January 2026.</p>
    </div>
  </div>

  <!-- The rest of your content (intro, sections, footer, scripts) stays the same -->

  <!-- Only small script adjustment for better countdown feedback -->
  <script>
    // ... your existing scripts ...

    // Improved countdown
    (function(){
      const el = document.getElementById('countdown-badge');
      if(!el) return;

      const KICKOFF = new Date('2026-01-23T10:00:00-05:00').getTime();

      function update() {
        const diff = KICKOFF - Date.now();
        if (diff <= 0) {
          el.textContent = 'LIVE!';
          el.setAttribute('aria-label', 'The kickoff event is happening now');
          return;
        }

        const d = Math.floor(diff / 86400000);
        const h = Math.floor((diff % 86400000) / 3600000);

        el.textContent = d >= 1 ? `${d}d` : `${h}h`;
        el.setAttribute('aria-label', `${d} days ${h} hours until kickoff`);
      }

      update();
      setInterval(update, 60000);
    })();
  </script>

</body>
</html>
